<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>💕 She Said Yes!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { width:100%; height:100%; overflow:hidden; background:#020918; font-family:'Quicksand',sans-serif; }

    .bg {
      position:fixed; inset:0;
      background: url('Background.png') center center/cover no-repeat;
      animation: slowPan 30s ease-in-out infinite alternate;
    }
    @keyframes slowPan { from{transform:scale(1.05) translate(0,0)} to{transform:scale(1.05) translate(-2%,-1%)} }

    /* Particle canvas */
    #canvas { position:fixed; inset:0; z-index:1; pointer-events:none; }

    .scene { position:fixed; inset:0; z-index:2; display:flex; align-items:center; justify-content:center; }

    .card {
      background: rgba(5, 15, 40, 0.88);
      border: 1px solid rgba(245,200,66,0.4);
      border-radius: 32px;
      padding: 52px 44px 50px;
      max-width: 500px; width: 92%;
      text-align: center;
      backdrop-filter: blur(28px);
      box-shadow:
        0 0 100px rgba(245,200,66,.18),
        0 0 200px rgba(245,200,66,.08),
        inset 0 1px 0 rgba(255,255,255,.08);
      animation: floatCard 5s ease-in-out infinite, cardEnter 0.7s cubic-bezier(.4,0,.2,1);
    }
    @keyframes floatCard { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }
    @keyframes cardEnter { from{opacity:0;transform:scale(.88) translateY(30px)} to{opacity:1;transform:scale(1) translateY(0)} }

    .emoji-row {
      font-size: 2.4rem;
      margin-bottom: 16px;
      animation: emojiPop 1.2s cubic-bezier(.4,0,.2,1);
      letter-spacing: 6px;
    }
    @keyframes emojiPop {
      0%   { transform: scale(0); opacity: 0; }
      60%  { transform: scale(1.3); opacity: 1; }
      100% { transform: scale(1); }
    }

    .heart-img {
      width: 120px; height: 120px;
      object-fit: contain;
      filter: drop-shadow(0 0 24px rgba(245,200,66,.7)) drop-shadow(0 0 50px rgba(245,200,66,.35));
      animation: heartPulse 2s ease-in-out infinite;
      margin-bottom: 18px;
    }
    @keyframes heartPulse {
      0%,100% { transform: scale(1); }
      50%      { transform: scale(1.1); }
    }

    .congrats-title {
      font-family: 'Dancing Script', cursive;
      font-size: clamp(2.2rem, 6vw, 3.2rem);
      color: #ffe787;
      text-shadow: 0 0 20px rgba(245,200,66,.6), 0 0 50px rgba(245,200,66,.3);
      margin-bottom: 16px;
      line-height: 1.2;
    }

    .congrats-sub {
      font-family: 'Dancing Script', cursive;
      font-size: clamp(1.1rem, 3vw, 1.4rem);
      color: #a8d4f0;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .divider {
      width: 60px; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(245,200,66,.5), transparent);
      margin: 0 auto 26px;
    }

    .poem {
      font-family: 'Dancing Script', cursive;
      font-size: 1.1rem;
      color: rgba(255,231,135,.75);
      line-height: 1.9;
      font-style: italic;
    }

    /* Floating hearts */
    .floating-heart {
      position: fixed;
      font-size: 1.5rem;
      animation: floatUp var(--dur,6s) ease-in var(--delay,0s) infinite;
      z-index: 3;
      pointer-events: none;
    }
    @keyframes floatUp {
      0%   { transform: translateY(0) scale(0.8) rotate(var(--rot,-5deg)); opacity:0.9; }
      100% { transform: translateY(-110vh) scale(0.4) rotate(var(--rot2,8deg)); opacity:0; }
    }
  </style>
</head>
<body>

<div class="bg"></div>
<canvas id="canvas"></canvas>

<div class="scene">
  <div class="card">
    <div class="emoji-row">💫 ✨ 💕</div>
    <img src="Heart.png" class="heart-img" alt="Heart"/>
    <div class="congrats-title">She Said Yes!! 🎉</div>
    <div class="congrats-sub">You two are written in the stars ✨<br>The universe agrees — you're meant to be 🌌</div>
    <div class="divider"></div>
    <div class="poem">
      Under a sky full of stars,<br>
      I found my favourite constellation —<br>
      it looked just like you 💛
    </div>
  </div>
</div>

<script>
  // Floating hearts
  const emojis = ['💕','💫','✨','🌟','💛','🥰','💖','⭐','🌙'];
  for(let i=0;i<18;i++){
    const el = document.createElement('div');
    el.className = 'floating-heart';
    el.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    const dur = 5+Math.random()*6;
    const delay = Math.random()*8;
    const rot  = (Math.random()*20-10)+'deg';
    const rot2 = (Math.random()*20-10)+'deg';
    el.style.cssText = `left:${Math.random()*100}%;bottom:-60px;--dur:${dur}s;--delay:${delay}s;--rot:${rot};--rot2:${rot2}`;
    document.body.appendChild(el);
  }

  // Sparkling canvas particles
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  let W, H, particles=[];

  function resize(){
    W=canvas.width=window.innerWidth;
    H=canvas.height=window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  function Particle(){
    this.reset = function(){
      this.x = Math.random()*W;
      this.y = Math.random()*H;
      this.r = 0.5+Math.random()*2;
      this.alpha = 0;
      this.targetAlpha = 0.3+Math.random()*0.7;
      this.speed = 0.008+Math.random()*0.015;
      this.phase = Math.random()*Math.PI*2;
      this.color = Math.random()>.5 ? '#ffe787' : '#4fc3f7';
    };
    this.reset();
    this.update = function(){
      this.phase += this.speed;
      this.alpha = this.targetAlpha * (0.5+0.5*Math.sin(this.phase));
    };
    this.draw = function(){
      ctx.globalAlpha = this.alpha;
      ctx.fillStyle = this.color;
      ctx.beginPath();
      ctx.arc(this.x,this.y,this.r,0,Math.PI*2);
      ctx.fill();
    };
  }

  for(let i=0;i<120;i++){
    const p=new Particle();
    p.phase=Math.random()*Math.PI*2;
    particles.push(p);
  }

  function loop(){
    ctx.clearRect(0,0,W,H);
    ctx.globalAlpha=1;
    particles.forEach(p=>{ p.update(); p.draw(); });
    requestAnimationFrame(loop);
  }
  loop();
</script>
</body>
</html>
